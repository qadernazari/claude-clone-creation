name: Hero perf regression

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      lcp_budget_ms:
        description: "LCP budget in ms"
        required: false
        default: "2500"
      viewports:
        description: "Comma-separated viewport keys"
        required: false
        default: "mobile,tablet,laptop,desktop"

concurrency:
  group: perf-hero-${{ github.ref }}
  cancel-in-progress: true

jobs:
  perf-hero:
    name: perf:hero (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      LCP_BUDGET_MS: ${{ github.event.inputs.lcp_budget_ms || '2500' }}
      VIEWPORTS: ${{ github.event.inputs.viewports || 'mobile,tablet,laptop,desktop' }}
      BASE_URL: http://localhost:8080
      REPORT_DIR: ${{ github.workspace }}/perf-reports
      # Public envs the app needs to boot. Secrets that must stay private are
      # provided via repo secrets and mapped below.
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_SUPABASE_PROJECT_ID: ${{ vars.VITE_SUPABASE_PROJECT_ID }}
      SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('bun.lockb', 'package.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps chromium

      - name: Install Playwright OS deps
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: bunx playwright install-deps chromium

      - name: Start dev server
        run: |
          mkdir -p perf-reports
          bun run dev > perf-reports/dev-server.log 2>&1 &
          echo $! > perf-reports/dev.pid

      - name: Wait for dev server on :8080
        run: |
          for i in $(seq 1 60); do
            if curl -sSf -o /dev/null http://localhost:8080/; then
              echo "dev server is up after ${i}s"
              exit 0
            fi
            sleep 2
          done
          echo "dev server never became ready"
          echo "--- dev-server.log tail ---"
          tail -n 200 perf-reports/dev-server.log || true
          exit 1

      - name: Run perf:hero
        id: perf
        run: npm run perf:hero

      - name: Stop dev server
        if: always()
        run: |
          if [ -f perf-reports/dev.pid ]; then
            kill "$(cat perf-reports/dev.pid)" 2>/dev/null || true
          fi

      - name: Summarize 390px assertions
        if: always() && steps.perf.outcome != 'skipped' && steps.perf.outcome != 'cancelled'
        env:
          PERF_OUTCOME: ${{ steps.perf.outcome }}
        run: |
          node <<'NODE'
          const fs = require("fs");
          const path = require("path");
          const dir = process.env.REPORT_DIR;
          const summaryPath = process.env.GITHUB_STEP_SUMMARY;
          const write = (s) => fs.appendFileSync(summaryPath, s + "\n");
          const annotate = (level, msg, file) => {
            const props = file ? `file=${file}` : "";
            // ::error / ::warning workflow commands surface as PR annotations.
            console.log(`::${level} ${props}::${msg}`);
          };

          const jsons = fs.existsSync(dir)
            ? fs.readdirSync(dir)
                .filter(f => /^perf-hero-.*\.json$/.test(f))
                .map(f => ({ f, m: fs.statSync(path.join(dir, f)).mtimeMs }))
                .sort((a, b) => b.m - a.m)
            : [];
          if (!jsons.length) {
            write("## Hero perf — 390px");
            write("");
            write("_No perf-hero report found (dev server or Playwright likely failed to start)._");
            annotate("error", "perf:hero produced no report file", ".github/workflows/perf-hero.yml");
            process.exit(0);
          }
          const jsonPath = path.join(dir, jsons[0].f);
          const report = JSON.parse(fs.readFileSync(jsonPath, "utf8"));
          const mobile = (report.results || []).find(r =>
            r.viewport_key === "mobile" ||
            /390/.test(r.viewport_label || "") ||
            r.viewport_width === 390,
          );

          write("## Hero perf — 390px (mobile)");
          write("");
          if (!mobile) {
            write("_390px viewport was not exercised in this run._");
            annotate("warning", "390px viewport missing from perf-hero results");
            process.exit(0);
          }

          const budget = mobile.lcp_budget_ms ?? report.lcp_budget_ms ?? null;
          // Pick the last attempt's beacon as authoritative; fall back to any.
          const attempts = mobile.attempts || [];
          const last = attempts[attempts.length - 1] || {};
          const beacon = last.beacon || last.lastBeacon || {};
          const lcp = typeof beacon.lcp_ms === "number" ? beacon.lcp_ms : null;
          const cacheHit = beacon.preload_cache_hit;

          const lcpOk = lcp != null && budget != null && lcp <= budget;
          const cacheOk = cacheHit === true;

          const lcpIcon = lcp == null ? "❓" : lcpOk ? "✅" : "❌";
          const cacheIcon = cacheHit == null ? "❓" : cacheOk ? "✅" : "❌";

          write("| Assertion | Status | Observed | Budget / Expected |");
          write("| --- | --- | --- | --- |");
          write(`| LCP | ${lcpIcon} | ${lcp == null ? "n/a" : lcp + " ms"} | ${budget == null ? "n/a" : "≤ " + budget + " ms"} |`);
          write(`| preload_cache_hit | ${cacheIcon} | \`${JSON.stringify(cacheHit)}\` | \`true\` |`);
          write("");
          write(`Attempts: ${attempts.length} · Result: **${mobile.ok ? "pass" : "fail"}**${mobile.reason ? " — " + mobile.reason : ""}`);
          write("");
          write(`Report: \`${path.basename(jsonPath)}\` (uploaded as workflow artifact)`);

          // PR annotations — only when a specific assertion actually failed,
          // so we don't spam the diff on green runs.
          if (lcp != null && budget != null && !lcpOk) {
            annotate("error", `390px LCP ${lcp}ms exceeds budget ${budget}ms`, "src/components/featured-film.tsx");
          }
          if (cacheHit !== undefined && !cacheOk) {
            annotate(
              "error",
              `390px preload_cache_hit=${JSON.stringify(cacheHit)} (expected true) — hero LCP image was not served from the SSR preload`,
              "src/routes/index.tsx",
            );
          }
          if (lcp == null) {
            annotate("warning", "390px beacon did not report lcp_ms — see failure artifacts");
          }
          NODE


      - name: Extract 390px (mobile) failure slice
        if: failure() && steps.perf.outcome == 'failure'
        run: |
          node <<'NODE'
          const fs = require("fs");
          const path = require("path");
          const dir = process.env.REPORT_DIR;
          // Latest perf-hero-*.json in the report dir.
          const jsons = fs.readdirSync(dir)
            .filter(f => /^perf-hero-.*\.json$/.test(f))
            .map(f => ({ f, m: fs.statSync(path.join(dir, f)).mtimeMs }))
            .sort((a, b) => b.m - a.m);
          if (!jsons.length) { console.log("no perf-hero JSON found"); process.exit(0); }
          const jsonPath = path.join(dir, jsons[0].f);
          const htmlPath = jsonPath.replace(/\.json$/, ".html");
          const report = JSON.parse(fs.readFileSync(jsonPath, "utf8"));

          const results = Array.isArray(report.results) ? report.results : [];
          const mobile = results.find(r =>
            r.viewport_key === "mobile" ||
            /390/.test(r.viewport_label || "") ||
            r.viewport_width === 390
          );
          if (!mobile) { console.log("no mobile/390px result in report"); process.exit(0); }
          if (mobile.ok) { console.log("mobile passed; nothing to extract"); process.exit(0); }

          const failed = (mobile.attempts || []).filter(a => !a.ok);
          const slice = {
            source_report: path.basename(jsonPath),
            generated_at: report.generated_at || null,
            base_url: report.base_url || null,
            viewport: {
              key: mobile.viewport_key,
              label: mobile.viewport_label,
              width: mobile.viewport_width,
              height: mobile.viewport_height,
            },
            budgets: {
              lcp_ms: mobile.lcp_budget_ms,
              transfer_bytes: mobile.transfer_budget_bytes,
            },
            summary: {
              ok: mobile.ok,
              reason: mobile.reason,
              attempts_total: (mobile.attempts || []).length,
              attempts_failed: failed.length,
            },
            failed_attempts: failed.map(a => ({
              attempt: a.attempt,
              ok: a.ok,
              reason: a.reason,
              beacon: a.beacon,
              last_beacon: a.lastBeacon,
              beacon_wait: a.beaconWait,
              timing: a.timing,
              rendered_src: a.renderedSrc,
              active_preload: a.activePreload,
              dom_preloads: a.domPreloads,
              preload_assertion: a.preloadAssertion,
              cache_probe: a.cacheProbe,
              cover_transfers: a.transfers?.["film-covers"] || [],
              thumb_transfers: a.transfers?.["film-thumbnails"] || [],
              har_path: a.harPath,
              trace_path: a.tracePath,
              screenshot_path: a.screenshotPath,
            })),
          };

          const outJson = path.join(dir, "mobile-390-failure.json");
          fs.writeFileSync(outJson, JSON.stringify(slice, null, 2));
          console.log("wrote", outJson);
          if (fs.existsSync(htmlPath)) {
            fs.copyFileSync(htmlPath, path.join(dir, "mobile-390-failure.html"));
            console.log("copied companion HTML");
          }

          // Stage referenced failure artifacts (HAR, trace, PNG) into a
          // predictable subdir so the upload glob catches them even if the
          // paths in the JSON are absolute.
          const stageDir = path.join(dir, "mobile-390-artifacts");
          fs.mkdirSync(stageDir, { recursive: true });
          for (const a of failed) {
            for (const p of [a.harPath, a.tracePath, a.screenshotPath]) {
              if (p && fs.existsSync(p)) {
                fs.copyFileSync(p, path.join(stageDir, path.basename(p)));
              }
            }
          }
          NODE

      - name: Upload perf reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-hero-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            perf-reports/**
          if-no-files-found: warn
          retention-days: 14

      - name: Upload 390px failure slice
        if: failure() && steps.perf.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: perf-hero-mobile-390-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            perf-reports/mobile-390-failure.json
            perf-reports/mobile-390-failure.html
            perf-reports/mobile-390-artifacts/**
          if-no-files-found: warn
          retention-days: 30

